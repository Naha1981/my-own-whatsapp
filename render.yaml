# Render Blueprint — production-oriented configuration for the reusable WhatsApp Operator.
# The Free plan is retained for initial testing. For client production, use an always-on
# paid instance because Free services can sleep after 15 minutes without inbound traffic.
services:
  - type: web
    name: nahalabs-whatsapp-operator
    runtime: docker
    rootDir: whatsapp-operator
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: OPERATOR_API_KEY
        sync: false
