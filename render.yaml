# Render Blueprint — deploys ONLY the WhatsApp Operator (rootDir: whatsapp-operator).
#
# Usage:
#   1. Push this repo to GitHub (already done if you're reading this from the repo).
#   2. Render → New → Blueprint → connect the repo → Render reads this file.
#   3. It prompts you for the 3 secrets below (sync: false) — generate them with
#      `openssl rand -hex 32` and paste the same values into every Core app's env.
#   4. Apply → the Operator builds (Docker) and deploys.
#   5. Copy the resulting URL into every app's OPERATOR_URL.

services:
  - type: web
    name: nahalabs-whatsapp-operator
    runtime: docker
    rootDir: whatsapp-operator
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: OPERATOR_API_KEY
        sync: false
