name: WhatsApp Operator CI

on:
  pull_request:
    paths:
      - 'whatsapp-operator/**'
      - '.github/workflows/operator-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'whatsapp-operator/**'
      - '.github/workflows/operator-ci.yml'

jobs:
  operator-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-operator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
