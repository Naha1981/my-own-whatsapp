name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  operator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-operator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: whatsapp-operator/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
