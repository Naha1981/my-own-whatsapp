name: Render keepalive

on:
  schedule:
    # Run every 10 minutes, deliberately offset from the top of the hour to
    # reduce contention with the busiest scheduled-workflow window.
    - cron: '3/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    # The slim runner starts faster and is more than enough for one HTTP request.
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Wake and keep Render operator warm
        env:
          RENDER_OPERATOR_URL: ${{ secrets.RENDER_OPERATOR_URL }}
        run: |
          set -euo pipefail
          : "${RENDER_OPERATOR_URL:?Set RENDER_OPERATOR_URL in repository secrets}"

          url="${RENDER_OPERATOR_URL%/}/health?keepalive=$(date +%s)"
          printf '[keepalive] GET %s\n' "$url"

          curl --fail --silent --show-error --location \
            --retry 2 \
            --retry-delay 5 \
            --retry-connrefused \
            --connect-timeout 10 \
            --max-time 90 \
            -H 'Cache-Control: no-cache' \
            -H 'Pragma: no-cache' \
            "$url"

          printf '\n[keepalive] Render operator is reachable\n'
