name: Render keepalive

on:
  schedule:
    # Every 10 minutes. Render Free sleeps after 15 minutes with no inbound traffic.
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wake and keep Render operator warm
        env:
          RENDER_OPERATOR_URL: ${{ secrets.RENDER_OPERATOR_URL }}
        run: bash scripts/render-keepalive.sh
