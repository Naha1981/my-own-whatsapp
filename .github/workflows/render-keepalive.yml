name: Render keepalive

on:
  schedule:
    # Keep a 10-minute heartbeat, offset from common cron boundaries.
    - cron: '3/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render operator
        env:
          RENDER_OPERATOR_URL: ${{ secrets.RENDER_OPERATOR_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RENDER_OPERATOR_URL:-}" ]]; then
            echo "ERROR: repository secret RENDER_OPERATOR_URL is not configured."
            exit 1
          fi

          url="${RENDER_OPERATOR_URL%/}/health?keepalive=$(date +%s)"
          echo "[keepalive] GET ${url}"

          # Render may take a moment to wake after sleeping. Retry connection
          # failures and transient HTTP failures without cancelling another run.
          response="$(curl --silent --show-error --location \
            --retry 5 \
            --retry-delay 5 \
            --retry-max-time 150 \
            --connect-timeout 20 \
            --max-time 60 \
            --write-out '\n%{http_code}' \
            -H 'Cache-Control: no-cache' \
            -H 'Pragma: no-cache' \
            "${url}")"

          http_code="${response##*$'\n'}"
          body="${response%$'\n'*}"

          echo "[keepalive] HTTP ${http_code}"
          echo "${body}"

          if [[ "${http_code}" -lt 200 || "${http_code}" -ge 400 ]]; then
            echo "ERROR: Render health endpoint returned HTTP ${http_code}."
            exit 1
          fi

          echo "[keepalive] Render operator is reachable"
