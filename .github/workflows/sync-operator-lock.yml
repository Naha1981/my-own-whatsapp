name: Sync operator lockfile

on:
  push:
    branches: [hardening/multitenant-whatsapp]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-operator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit lockfile when package metadata changed
        working-directory: .
        run: |
          if git diff --quiet -- whatsapp-operator/package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whatsapp-operator/package-lock.json
          git commit -m "chore: sync operator package lockfile"
          git push origin HEAD:hardening/multitenant-whatsapp
